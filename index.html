<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورقة وقلم | أدوات مكتبية للطلبة</title>
<style>
:root{--ink:#2b2a33;--muted:#6b6877;--bg:#fbf8f3;--card:#fff;--accent:#3f6fa3;--accent-d:#2f5784;--line:#e9e3d9;--sand:#f1ebe0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:rgba(251,248,243,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:700;text-decoration:none;color:var(--accent-d)}
.nav{display:flex;gap:6px 18px;flex:1;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-color:var(--accent)}
.cart-link{text-decoration:none;background:var(--accent);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600}
.badge{background:#fff;color:var(--accent-d);border-radius:999px;padding:0 8px;margin-inline-start:4px}
main{padding-top:24px;padding-bottom:48px;min-height:70vh}
h1{font-size:30px;margin:8px 0 12px}h2{font-size:22px;margin:32px 0 14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:var(--sand);border-radius:20px;overflow:hidden}
.hero .txt{padding:36px}.hero img{width:100%;height:100%;object-fit:cover;min-height:280px;display:block}
.hero p{color:var(--muted);font-size:17px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;text-decoration:none}
.btn:hover{background:var(--accent-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--sand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none}
.cat b{display:block;font-size:18px}.cat span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sand)}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card a.t{font-weight:600;text-decoration:none}.price{color:var(--accent-d);font-weight:700}
.card .b p{margin:0;color:var(--muted);font-size:14px}.card .btn{margin-top:auto}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.perk b{display:block}.perk span{color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.detail img{width:100%;border-radius:16px;display:block}
.crumbs{color:var(--muted);font-size:14px}.crumbs a{text-decoration:none}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start}
.facts td:first-child{color:var(--muted);width:40%}
.cartrow{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cartrow img{width:72px;height:54px;object-fit:cover;border-radius:8px}
.qty{display:inline-flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.sum div{display:flex;justify-content:space-between;padding:6px 0}.sum .tot{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label.f{display:block;margin:10px 0}label.f span{display:block;color:var(--muted);font-size:14px}label.f input,label.f textarea{width:100%}
.ok{background:#eaf4ee;border:1px solid #cfe5d6;border-radius:14px;padding:20px}
.foot{background:var(--sand);border-top:1px solid var(--line);padding:28px 0}
.foot-in{display:grid;grid-template-columns:1fr 1fr;gap:16px}.foot a{display:block;text-decoration:none;color:var(--muted)}
.foot .note{grid-column:1/-1;color:var(--muted);font-size:13px;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:20}
@media(max-width:760px){.hero,.detail,.two{grid-template-columns:1fr}.cats{grid-template-columns:1fr}.perks{grid-template-columns:1fr 1fr}.hero .txt{padding:22px}h1{font-size:25px}.foot-in{grid-template-columns:1fr}}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr;gap:12px}.nav{order:3;flex-basis:100%}.cart-link{margin-inline-start:auto}.card .b{padding:10px}}

</style>
</head>

  function count() { return Object.keys(cart).reduce(function (s, k) { return s + cart[k]; }, 0); }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1600); }
  function add(id) { cart[id] = (cart[id] || 0) + 1; save(); updateCount(); toast('اتضاف للسلة'); }
  function updateCount() { document.getElementById('count').textContent = count(); }
  function card(p) {
    return '<article class="card"><a href="#/product/' + p.id + '"><img src="' + IMG[p.img] + '" alt="' + esc(p.name) + '" loading="lazy"></a><div class="b"><a class="t" href="#/product/' + p.id + '">' + esc(p.name) + '</a><p>' + esc(p.short) + '</p><div class="price">' + money(p.price) + '</div><button class="btn sm" data-add="' + p.id + '">أضيفي للسلة</button></div></article>';
  }

  function home() {
    return '<section class="hero"><div class="txt"><h1>كل أدوات مذاكرتك في مكان واحد</h1><p>كشاكيل وبلانرز وأقلام وتنظيم للمكتب، بألوان هادية تخلي مذاكرتك أريح.</p><a class="btn" href="#/shop">تسوقي دلوقتي</a></div><img src="' + IMG.hero + '" alt="أدوات مكتبية مرتبة على مكتب"></section>' +
      '<h2>الأقسام</h2><div class="cats">' + cats.map(function (c) { return '<a class="cat" href="#/shop/' + c.id + '"><b>' + c.name + '</b><span>' + c.blurb + '</span></a>'; }).join('') + '</div>' +
      '<h2>الأكثر طلبا</h2><div class="grid">' + products.slice(0, 4).map(card).join('') + '</div>' +
      '<h2>ليه ورقة وقلم؟</h2><div class="perks"><div class="perk"><b>توصيل</b><span>خلال ٣ أيام عمل</span></div><div class="perk"><b>دفع</b><span>عند الاستلام</span></div><div class="perk"><b>استرجاع</b><span>خلال ٧ أيام</span></div><div class="perk"><b>شحن</b><span>' + money(SHIPPING) + '</span></div></div>';
  }
  function shopPage() {
    var list = products.filter(function (p) { return (shop.cat === 'all' || p.cat === shop.cat) && p.name.indexOf(shop.q.trim()) !== -1; });
    if (shop.sort === 'low') list = list.slice().sort(function (a, b) { return a.price - b.price; });
    if (shop.sort === 'high') list = list.slice().sort(function (a, b) { return b.price - a.price; });
    var chips = [['all', 'الكل']].concat(cats.map(function (c) { return [c.id, c.name]; })).map(function (c) { return '<button class="chip' + (shop.cat === c[0] ? ' on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>'; }).join('');
    return '<h1>المتجر</h1><div class="tools"><input id="q" placeholder="ابحثي باسم المنتج" value="' + esc(shop.q) + '">' + chips +
      '<select id="sort"><option value="default"' + (shop.sort === 'default' ? ' selected' : '') + '>الترتيب الافتراضي</option><option value="low"' + (shop.sort === 'low' ? ' selected' : '') + '>الأرخص أولا</option><option value="high"' + (shop.sort === 'high' ? ' selected' : '') + '>الأغلى أولا</option></select></div>' +
      '<p class="crumbs">' + list.length + ' من ' + products.length + ' منتجات</p>' +
      (list.length ? '<div class="grid" id="list">' + list.map(card).join('') + '</div>' : '<p>مفيش منتج بالاسم ده. جربي كلمة تانية.</p>');
  }
  function productPage(id) {
    var p = byId(id); if (!p) return '<h1>المنتج مش موجود</h1><a class="btn" href="#/shop">كل المنتجات</a>';
    var rel = products.filter(function (x) { return x.cat === p.cat && x.id !== p.id; }).slice(0, 3);
    return '<p class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/shop/' + p.cat + '">' + catName(p.cat) + '</a> / ' + esc(p.name) + '</p><div class="detail"><img src="' + IMG[p.img] + '" alt="' + esc(p.name) + '"><div><h1>' + esc(p.name) + '</h1><div class="price" style="font-size:24px">' + money(p.price) + '</div><p>' + esc(p.short) + '</p><table class="facts">' + p.facts.map(function (f) { return '<tr><td>' + f[0] + '</td><td>' + f[1] + '</td></tr>'; }).join('') + '</table><p><button class="btn" data-add="' + p.id + '">أضيفي للسلة</button> <a class="btn sec" href="#/cart">السلة</a></p></div></div>' +
      (rel.length ? '<h2>منتجات مشابهة</h2><div class="grid">' + rel.map(card).join('') + '</div>' : '');
  }
  function cartTotals() {
    var sub = 0; Object.keys(cart).forEach(function (k) { if (cart[k] > 0 && byId(k)) sub += byId(k).price * cart[k]; });
    var ship = sub > 0 ? SHIPPING : 0; return { sub: sub, ship: ship, total: sub + ship };
  }
  function cartPage() {
    if (order) {
      var o = order;
      return '<div class="ok"><h1>تم استلام طلبك التجريبي</h1><p>شكرا يا ' + esc(o.name) + '. رقم الطلب التجريبي: ' + o.no + '.</p><p>الإجمالي ' + money(o.total) + ' والدفع عند الاستلام.</p><p>ده طلب تجريبي لمشروع تعليمي. مفيش دفع ولا شحن حقيقي، والبيانات ما اتحفظتش.</p><a class="btn" href="#/shop" data-clear>كملي تسوق</a></div>';
    }
    var ids = Object.keys(cart).filter(function (k) { return cart[k] > 0 && byId(k); });
    if (!ids.length) return '<h1>السلة</h1><p>السلة فاضية.</p><a class="btn" href="#/shop">روحي للمتجر</a>';
    var t = cartTotals();
    var rows = ids.map(function (k) { var p = byId(k); return '<div class="cartrow"><img src="' + IMG[p.img] + '" alt=""><div><a href="#/product/' + p.id + '">' + esc(p.name) + '</a><div class="price">' + money(p.price) + '</div><span class="qty"><button data-dec="' + k + '" aria-label="نقصي">−</button><b>' + cart[k] + '</b><button data-inc="' + k + '" aria-label="زودي">+</button></span></div><div><b>' + money(p.price * cart[k]) + '</b> <button class="btn sec sm" data-rm="' + k + '">حذف</button></div></div>'; }).join('');
    return '<h1>سلة المشتريات</h1><div class="two"><div class="box">' + rows + '</div><div class="box"><h2 style="margin-top:0">إتمام الطلب</h2><div class="sum"><div><span>المنتجات</span><span>' + money(t.sub) + '</span></div><div><span>الشحن</span><span>' + money(t.ship) + '</span></div><div class="tot"><span>الإجمالي</span><span>' + money(t.total) + '</span></div></div>' +
      '<label class="f"><span>الاسم</span><input id="n"></label><label class="f"><span>رقم الموبايل</span><input id="ph" dir="ltr" inputmode="tel"></label><label class="f"><span>العنوان</span><input id="ad"></label><button class="btn" id="go" disabled>تأكيد الطلب (تجريبي)</button><p class="crumbs">الدفع عند الاستلام. مفيش أي دفع حقيقي.</p></div></div>';
  }
  function about() {
    return '<h1>من نحن</h1><div class="box"><p>ورقة وقلم متجر أدوات مكتبية للطلبة، فكرته إن المذاكرة تبقى منظمة ومريحة بأدوات بسيطة وألوان هادية.</p><p>المتجر ده مشروع تعليمي لمادة مبادئ الأعمال الإلكترونية، والمنتجات والأسعار أمثلة للتوضيح.</p><table class="facts"><tr><td>الفئة المستهدفة</td><td>طلبة المدارس والجامعات</td></tr><tr><td>المنتجات</td><td>' + products.length + ' منتجات في ' + cats.length + ' أقسام</td></tr><tr><td>الدفع</td><td>عند الاستلام</td></tr></table></div>';
  }
  function contact() {
    return '<h1>تواصلي معانا</h1><div class="two"><div class="box" id="cbox"><label class="f"><span>الاسم</span><input id="cn"></label><label class="f"><span>رسالتك</span><textarea id="cm" rows="4"></textarea></label><button class="btn" id="cs" disabled>إرسال (تجريبي)</button></div><div class="box"><b>مواعيد العمل</b><p>يوميا من ١٠ صباحا لـ ٨ مساء (مثال).</p><b>الرد</b><p>خلال يوم عمل (مثال).</p></div></div>';
  }
  function policies() {
    return '<h1>الشحن والاسترجاع</h1><div class="box"><h2 style="margin-top:0">الشحن والتوصيل</h2><ul><li>رسوم الشحن ' + money(SHIPPING) + ' للطلب.</li><li>التوصيل خلال ٣ أيام عمل.</li><li>الدفع عند الاستلام.</li></ul><h2>الاسترجاع</h2><ul><li>الاسترجاع خلال ٧ أيام من الاستلام.</li><li>المنتج يرجع في حالته الأصلية.</li></ul><h2>أسئلة شائعة</h2><ul><li>هل أقدر أعدل الطلب؟ أيوه قبل الشحن.</li><li>هل فيه خصم للكميات؟ مش متاح حاليا.</li></ul><p class="crumbs">كل ده أمثلة لمشروع تعليمي.</p></div>';
  }

  function render() {
    var h = (location.hash || '#/').slice(1).split('/'); var r = h[1] || ''; var arg = h[2];
    var route = r === '' ? 'home' : r;
    if (route === 'shop' && arg && (arg === 'all' || cats.some(function (c) { return c.id === arg; }))) shop.cat = arg;
    var html = route === 'home' ? home() : route === 'shop' ? shopPage() : route === 'product' ? productPage(arg) : route === 'cart' ? cartPage() : route === 'about' ? about() : route === 'contact' ? contact() : route === 'policies' ? policies() : '<h1>الصفحة مش موجودة</h1><a class="btn" href="#/">الرئيسية</a>';
    app.innerHTML = html; window.scrollTo(0, 0); updateCount();
    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) { a.classList.toggle('on', a.getAttribute('data-r') === (route === 'product' ? 'shop' : route)); });
    bind(route);
  }
  function bind(route) {
    if (route === 'cart') {
      var go = document.getElementById('go');
      if (go) {
        var f = function () { go.disabled = !(document.getElementById('n').value.trim() && document.getElementById('ph').value.trim() && document.getElementById('ad').value.trim()); };
        ['n', 'ph', 'ad'].forEach(function (i) { document.getElementById(i).addEventListener('input', f); });
        go.addEventListener('click', function () { var t = cartTotals(); order = { name: document.getElementById('n').value.trim(), total: t.total, no: 'T-' + (1000 + Math.floor(Math.random() * 9000)) }; cart = {}; save(); render(); });
      }
      var clr = document.querySelector('[data-clear]'); if (clr) clr.addEventListener('click', function () { order = null; });
    }
    if (route === 'contact') {
      var cs = document.getElementById('cs'), cf = function () { cs.disabled = !(document.getElementById('cn').value.trim() && document.getElementById('cm').value.trim()); };
      document.getElementById('cn').addEventListener('input', cf); document.getElementById('cm').addEventListener('input', cf);
      cs.addEventListener('click', function () { document.getElementById('cbox').innerHTML = '<div class="ok"><b>تم</b><p>وصلتنا رسالتك التجريبية. ده مشروع تعليمي ومفيش رسايل بتتبعت فعلا.</p></div>'; });
    }
    if (route === 'shop') {
      var rerender = function () { var q = document.getElementById('q'); var pos = q.selectionStart; app.innerHTML = shopPage(); bind('shop'); var nq = document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos, pos); };
      document.getElementById('q').addEventListener('input', function (e) { shop.q = e.target.value; rerender(); });
      document.getElementById('sort').addEventListener('change', function (e) { shop.sort = e.target.value; app.innerHTML = shopPage(); bind('shop'); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function (b) { b.addEventListener('click', function () { shop.cat = b.getAttribute('data-cat'); app.innerHTML = shopPage(); bind('shop'); }); });
    }
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.getAttribute) {
      var a = t.getAttribute('data-add'), i = t.getAttribute('data-inc'), d = t.getAttribute('data-dec'), r = t.getAttribute('data-rm');
      if (a) add(a);
      if (i) { cart[i]++; save(); render(); }
      if (d) { cart[d] = Math.max(0, cart[d] - 1); save(); render(); }
      if (r) { delete cart[r]; save(); render(); }
    }
  });
  window.addEventListener('hashchange', function () { if (!/#\/cart/.test(location.hash)) order = null; render(); });
  render();
})();

</script>
</body>
</html>
